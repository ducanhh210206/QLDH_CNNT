# Standby moi de khoi tao lai ma khong dong vao container/volume cong 3307.
name: omdrs-standby-moi
services:
  mysql-standby:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${STANDBY_ROOT_PASSWORD:?Set a dedicated standby root password}
    ports:
      - "127.0.0.1:3308:3306"
    command:
      - --server-id=3
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-replica-start=ON
      - --event-scheduler=OFF
      - '--replicate-wild-do-table=order\_management.%'
    volumes:
      - standby_moi_data:/var/lib/mysql
      - ./mysql/init-standby-guard.sql:/docker-entrypoint-initdb.d/01-standby-guard.sql:ro
      - ../database/backups/aiven-ca.pem:/etc/mysql/aiven-ca.pem:ro
volumes:
  standby_moi_data:
