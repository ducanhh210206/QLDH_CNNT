# Local development: one Backend, existing MySQL, Frontend remains on host.
name: omdrs-backend-local
services:
  backend:
    image: omdrs-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: '5000'
      NODE_ENV: development
      DB_HOST: host.docker.internal
      MONITOR_URL: http://host.docker.internal:5001
    ports:
      - '127.0.0.1:5002:5000'
    volumes:
      - backend_backups:/app/database/backups
    restart: unless-stopped
volumes:
  backend_backups:
