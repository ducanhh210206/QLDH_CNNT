upstream omdrs_api {
 server backend-primary:5000 max_fails=1 fail_timeout=10s;
 server backend-standby:5000 backup max_fails=1 fail_timeout=10s;
 keepalive 16;
}
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 32k;
 location / { try_files $uri $uri/ /index.html; }
 location ~ ^/(api|health)/ {
  proxy_pass http://omdrs_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 2s;
  proxy_read_timeout 120s;
  # Passive failover only. Never retry non-idempotent requests on another node.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;
 }
}
